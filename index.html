<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portofolio Pribadi</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#home" id="brand">Portofolio</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#home">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="#about">Tentang</a></li>
          <li class="nav-item"><a class="nav-link" href="#skills">Keahlian</a></li>
          <li class="nav-item"><a class="nav-link" href="#projects">Proyek</a></li>
          <li class="nav-item"><a class="nav-link" href="#contact">Kontak</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section id="home" class="hero">
    <div class="container">
      <div class="row align-items-center g-5">
        <div class="col-md-7 order-2 order-md-1">
          <p class="role mb-2" id="role"></p>
          <h1 id="hero-title"></h1>
          <p class="text-secondary fs-5 mt-3" id="intro"></p>
          <a href="#projects" class="btn btn-main me-2">Lihat Proyek</a>
          <a href="#contact" class="btn btn-line">Hubungi Saya</a>
        </div>
        <div class="col-md-5 order-1 order-md-2 text-center">
          <img id="photo" class="hero-photo" alt="Foto profil">
        </div>
      </div>
    </div>
  </section>

  <section id="about">
    <div class="container">
      <h2 class="section-title">Tentang Saya</h2>
      <div class="about-box">
        <p class="mb-3" id="about-text"></p>
        <p class="mb-0 text-secondary"><i class="bi bi-geo-alt-fill me-2"></i><span id="location"></span></p>
      </div>
    </div>
  </section>

  <section id="skills">
    <div class="container">
      <h2 class="section-title">Keahlian</h2>
      <div class="row">
        <div class="col-lg-8" id="skill-list"></div>
      </div>
    </div>
  </section>

  <section id="projects">
    <div class="container">
      <h2 class="section-title">Proyek</h2>
      <div class="row g-4" id="project-list"></div>
    </div>
  </section>

  <section id="contact" class="contact">
    <div class="container">
      <h2 class="section-title">Kontak</h2>
      <p class="fs-5">Tertarik bekerja sama? Kirim email ke <a id="email" href="#"></a></p>
      <div id="socials"></div>
    </div>
  </section>

  <footer>
    <div class="container">&copy; <span id="year"></span> <span id="footer-name"></span></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    fetch("data.json")
      .then(res => res.json())
      .then(data => {
        showProfile(data.profile);
        showSkills(data.skills);
        showProjects(data.projects);
      })
      .catch(() => {
        document.getElementById("hero-title").textContent =
          "Data gagal dimuat. Buka website lewat server lokal (misalnya Live Server).";
      });

    function showProfile(p) {
      document.title = "Portofolio - " + p.name;
      document.getElementById("brand").textContent = p.name;
      document.getElementById("role").textContent = p.role;
      document.getElementById("hero-title").textContent = "Halo, saya " + p.name;
      document.getElementById("intro").textContent = p.intro;
      document.getElementById("photo").src = p.photo;
      document.getElementById("about-text").textContent = p.about;
      document.getElementById("location").textContent = p.location;
      document.getElementById("footer-name").textContent = p.name;
      document.getElementById("year").textContent = new Date().getFullYear();

      const email = document.getElementById("email");
      email.textContent = p.email;
      email.href = "mailto:" + p.email;

      document.getElementById("socials").innerHTML = p.socials
        .map(s => `<a href="${s.url}" target="_blank" class="social-link" title="${s.name}"><i class="bi ${s.icon}"></i></a>`)
        .join("");
    }

    function showSkills(skills) {
      document.getElementById("skill-list").innerHTML = skills
        .map(s => `
          <div class="skill-item">
            <div class="d-flex justify-content-between mb-1">
              <span class="fw-semibold">${s.name}</span>
              <span class="text-secondary">${s.level}%</span>
            </div>
            <div class="progress">
              <div class="progress-bar" style="width: ${s.level}%"></div>
            </div>
          </div>`)
        .join("");
    }

    function showProjects(projects) {
      document.getElementById("project-list").innerHTML = projects
        .map(p => `
          <div class="col-md-6 col-lg-4">
            <div class="card project-card h-100">
              <img src="${p.image}" class="card-img-top" alt="${p.title}">
              <div class="card-body">
                <h5 class="card-title">${p.title}</h5>
                <p class="card-text text-secondary">${p.description}</p>
                ${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}
              </div>
            </div>
          </div>`)
        .join("");
    }
  </script>
</body>
</html>
